version: 1.0.0

project_info:
  service_name: "credit_scoring"
  workflow_type: "training"
  experiment_id: "EXP-004"
  stage: "mvp"
  description: "Entrenamiento de MLP para puntaje crediticio."
  tags:
    - credit_scoring
    - mlp
    - training
    - tabular
    - binary_classification

environment:
  device: "auto"
  seed: 42
  workers: 0

data_source:
  dataset_name: "german_credit_risk"
  dataset_version: "v1.0.0"
  dataset_path: "../../datasets/ingeniia_services_credit_scoring_csv_german_credit_risk_v1.0.0_training_20250825/german_credit_risk.csv"
  data_path:
    dataset_path: "../../datasets/ingeniia_services_credit_scoring_csv_german_credit_risk_v1.0.0_training_20250825/german_credit_risk.csv"
    artifact_path: "model"
    preprocessor_filename: "german_credit_risk_preprocessor.joblib"
  version_tag: "v1"

preprocessing_params: "N/A"

model_config:
  model_name: "04_ingeniia_services_mlp_credit_scoring_model_v1.0.0_20250824.pt"
  model_family: "mlp"
  model_version: "v1.0.0"
  task: "binary_classification"

  architecture:
    hidden_layers: [256, 128, 64, 64]
    use_batch_norm: true
    activation_fn: "ReLU"
    dropout_rate: 0.1

  classes:
    - "good"
    - "bad"

training_params:
  test_size: 0.2
  random_state: 42
  epochs: 100
  batch_size: 32

  optimizer:
    name: "Adam"
    learning_rate: 0.001
    weight_decay: 0.0001

  loss_function:
    use_pos_weight: true

  scheduler:
    name: "ReduceLROnPlateau"
    patience: 5
    factor: 0.5

  early_stopping:
    patience: 10
    delta: 0.001

evaluation_params:
  batch_size: 1
  metrics:
    - accuracy
    - recall
    - f1_score
    - specificity
    - precision
    - roc_auc
  timing_metrics:
    - average_inference_time
    - average_processing_time
    - total_benchmark_time
  save_predictions: false
  save_failed_cases: true

mlops_config:
  tracking_uri: "http://127.0.0.1:5000"
  experiment_name: "ingeniia_services/credit_scoring/training"
  run_name: "EXP_004-credit_scoring-MLP-german_credit_risk_v100-training"
  artifact_root: ".mlflow/artifacts"

benchmark_specific: "N/A"